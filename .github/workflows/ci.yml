name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: python -m agent_sandbox.seccomp --check
      - name: Validate the defense-in-depth Compose file
        run: >
          docker compose
          -f "$(python examples/defense-in-depth/demo.py --compose-only --out "$RUNNER_TEMP/demo")"
          config --quiet

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=85
        env:
          # macOS ships LibreSSL as /usr/bin/openssl: the certificate tests must
          # run against it, besides any OpenSSL found on the PATH.
          OPENSSL: ${{ runner.os == 'macOS' && '/usr/bin/openssl' || '' }}

  end-to-end:
    # Builds both images, starts the sandbox and runs the in-container self-test.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - name: Verify isolation
        run: |
          mkdir -p "$RUNNER_TEMP/workspace"
          git -C "$RUNNER_TEMP/workspace" init -q
          agent-sandbox -w "$RUNNER_TEMP/workspace" verify --build
      - name: Alerts raised during the self-test
        if: always()
        run: agent-sandbox -w "$RUNNER_TEMP/workspace" alerts --events -n 200
      - name: Tear down
        if: always()
        run: agent-sandbox -w "$RUNNER_TEMP/workspace" down --volumes
