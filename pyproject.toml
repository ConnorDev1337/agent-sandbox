[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Hardened Docker sandbox for coding agents: seccomp, egress allowlist and canary tokens"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["sandbox", "docker", "seccomp", "llm", "agents", "canary-tokens", "egress"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["hypothesis>=6", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://gitlab.com/connorhack/tools/agent-sandbox"
Issues = "https://gitlab.com/connorhack/tools/agent-sandbox/-/issues"

[project.scripts]
agent-sandbox = "agent_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_sandbox = ["py.typed", ".dockerignore", "docker/*.Dockerfile", "docker/seccomp/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: end-to-end tests that build and run containers (need a Docker daemon)"]

[tool.coverage.run]
source = ["agent_sandbox"]
branch = true
# Run inside the containers; exercised by `agent-sandbox verify` (end-to-end job).
omit = ["*/agent_sandbox/selftest.py", "*/agent_sandbox/gateway/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "D"]
ignore = [
    "D1",  # Docstrings are optional; when present they must be well formed.
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "S108", "S603", "S607"]
