# Lint, unit tests and Compose validation. The end-to-end isolation test needs
# bind mounts on the Docker host, which a docker:dind *service* does not
# provide; the manual gvisor-end-to-end job runs the CLI next to its own Docker
# daemon instead. The test also runs in .github/workflows/ci.yml and locally via
# `agent-sandbox verify`.

stages: [lint, test, end-to-end]

default:
  image: python:3.13-slim
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.pip-cache:
  cache:
    key: pip-$CI_JOB_IMAGE
    paths: [.cache/pip]

lint:
  stage: lint
  extends: .pip-cache
  script:
    - pip install -e ".[dev]"
    - ruff check src tests examples
    - ruff format --check src tests examples
    - python -m agent_sandbox.seccomp --check

test:
  stage: test
  extends: .pip-cache
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  script:
    - pip install -e ".[dev]"
    - >
      python -m pytest
      --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85
      --junitxml=report.xml
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

libressl:
  # The certificate tests against LibreSSL, which macOS ships as
  # /usr/bin/openssl; Alpine's package installs it as /usr/bin/libressl, and
  # the image has no other openssl, so every TLS test mints with LibreSSL.
  stage: test
  extends: .pip-cache
  image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
  variables:
    OPENSSL: /usr/bin/libressl
  script:
    - apk add --no-cache libressl
    - pip install -e ".[dev]"
    - python -m pytest tests/test_tls_inspection.py -v

compose-config:
  stage: test
  image: docker:29-cli
  script:
    - apk add --no-cache python3 py3-pip
    - python3 -m pip install --break-system-packages .
    - mkdir -p /tmp/workspace && cd /tmp/workspace && git init -q 2>/dev/null || true
    - agent-sandbox -w /tmp/workspace init
    - >
      docker compose
      -f "$(agent-sandbox -w /tmp/workspace config | python3 -c 'import json,sys;
      print(json.load(sys.stdin)["state_dir"])')/compose.json" config --quiet
    # The defense-in-depth example's Compose file (labels, demo images, no build).
    - >
      docker compose -f "$(python3
      "$CI_PROJECT_DIR/examples/defense-in-depth/demo.py"
      --compose-only --out /tmp/demo-out)" config --quiet

gvisor-end-to-end:
  # Self-test under gVisor (runsc, systrap platform) and, as a control, runc:
  # scripts/e2e-dind.sh starts a Docker daemon inside this job's container,
  # installs a pinned gVisor release into it and runs `agent-sandbox verify`
  # there. Needs a runner with privileged mode (GitLab.com's hosted Linux
  # runners have it). Manual: it builds both images and downloads gVisor.
  stage: end-to-end
  image:
    name: docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
    entrypoint: [""]
  needs: []
  timeout: 45m
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  rules:
    - when: manual
      allow_failure: true
  script:
    - sh scripts/e2e-dind.sh "$CI_PROJECT_DIR"
