# Lint, unit tests and Compose validation. The end-to-end isolation test needs
# bind mounts on the Docker host, which Docker-in-Docker on shared runners does
# not provide; it runs in .github/workflows/ci.yml and locally via
# `agent-sandbox verify`.

stages: [lint, test]

default:
  image: python:3.13-slim
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.pip-cache:
  cache:
    key: pip-$CI_JOB_IMAGE
    paths: [.cache/pip]

lint:
  stage: lint
  extends: .pip-cache
  script:
    - pip install -e ".[dev]"
    - ruff check src tests
    - ruff format --check src tests
    - python -m agent_sandbox.seccomp --check

test:
  stage: test
  extends: .pip-cache
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  script:
    - pip install -e ".[dev]"
    - >
      python -m pytest
      --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85
      --junitxml=report.xml
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

compose-config:
  stage: test
  image: docker:29-cli
  script:
    - apk add --no-cache python3 py3-pip
    - python3 -m pip install --break-system-packages .
    - mkdir -p /tmp/workspace && cd /tmp/workspace && git init -q 2>/dev/null || true
    - agent-sandbox -w /tmp/workspace init
    - >
      docker compose
      -f "$(agent-sandbox -w /tmp/workspace config | python3 -c 'import json,sys;
      print(json.load(sys.stdin)["state_dir"])')/compose.json" config --quiet
